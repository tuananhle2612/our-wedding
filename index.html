<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anh&Thu Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f1;--fg:#3a2e2a;--muted:#8a7a72;--accent:#b5655a;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1816;--fg:#f1e7e1;--muted:#a89790;--accent:#e0968a;--card:#2a2220}}
:root[data-theme="dark"]{--bg:#1e1816;--fg:#f1e7e1;--muted:#a89790;--accent:#e0968a;--card:#2a2220}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.6;text-align:center}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}
section{max-width:900px;margin:0 auto;padding:72px 20px}
.reveal{opacity:0;transform:translateY(24px);transition:.8s}.reveal.in{opacity:1;transform:none}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;transition:opacity .8s}
#gate.hide{opacity:0;pointer-events:none}
#gate .heart{font-size:56px;animation:beat 1.4s infinite}
#gate .gate-prompt{display:inline-block;animation:beat 1.4s infinite}
#gate .gate-arrows{padding:0 8px}
@keyframes beat{50%{transform:scale(1.15)}}
.bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:40;display:flex;gap:8px}
.bar button{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.bar button.on{background:var(--accent);color:#fff}
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 70%)}
#hero h1{font-size:clamp(40px,10vw,84px)}#hero .amp{color:var(--accent);font-style:italic}
.date{letter-spacing:.3em;color:var(--muted)}
.countdown{margin:8px 0 4px}.countdown-title{margin:0 0 12px;color:var(--muted);font-size:14px}
.countdown-units{display:flex;gap:10px;justify-content:center}
.countdown-unit{width:clamp(54px,20vw,84px);padding:10px 6px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:12px;background:color-mix(in srgb,var(--card) 65%,transparent)}
.countdown-value{display:block;color:var(--accent);font-family:'Playfair Display',Georgia,serif;font-size:clamp(24px,6vw,36px);line-height:1.1;font-variant-numeric:tabular-nums}
.countdown-label{display:block;margin-top:4px;color:var(--muted);font-size:11px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{padding:12px 24px;border-radius:30px;border:1px solid var(--accent);color:var(--accent);background:transparent;font:inherit;font-size:15px;text-decoration:none;cursor:pointer}
.btn.fill{background:var(--accent);color:#fff}
h2{font-size:clamp(28px,6vw,42px);margin-bottom:8px}.sub{color:var(--muted);margin-bottom:36px}#story h2{margin-bottom:36px}
.story{display:grid;grid-template-columns:minmax(0,1fr);gap:40px}
.chap h3{font-size:24px;color:var(--accent);margin-bottom:12px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin:0 0 10px;align-items:start}.pair .ph:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}
.ph{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--card)),var(--card));display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;cursor:zoom-in}
.ph{position:relative}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}.ph.loaded img{position:static;height:auto;display:block;opacity:1}
.gal{columns:2 150px;column-gap:10px}.gal .ph{max-width:none;margin-bottom:10px;break-inside:avoid;aspect-ratio:auto;min-height:160px}.gal .ph:nth-child(3n){min-height:240px}
.card{background:var(--card);border-radius:16px;padding:28px;max-width:520px;margin:0 auto;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.card p{margin:6px 0}
.ev{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.ev .card{flex:1;min-width:230px}
footer{padding:60px 20px 90px;color:var(--muted)}
footer .qrcode{display:block;width:min(150px,40vw);height:auto;margin:28px auto 0}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:18px;text-decoration:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center;padding:20px;touch-action:none}
#lb.open{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px;user-select:none;-webkit-user-drag:none}
#lb button{position:absolute;top:50%;transform:translateY(-50%);border:1px solid rgba(255,255,255,.6);border-radius:50%;width:44px;height:44px;background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:26px;cursor:pointer}
#lb button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#lb .prev{left:16px}#lb .next{right:16px}
</style>
</head>
<body>

<div id="gate">
  <div class="heart">💍</div>
  <div class="gate-prompt"><span class="gate-arrows" aria-hidden="true">&gt;&gt;&gt;</span><span data-i="gate"></span><span class="gate-arrows" aria-hidden="true">&lt;&lt;&lt;</span></div>
  <div class="gate-prompt"><span class="gate-arrows" aria-hidden="true">&gt;&gt;&gt;</span>Touch Here<span class="gate-arrows" aria-hidden="true">&lt;&lt;&lt;</span></div>
</div>
<div class="bar"><button id="langBtn" class="on">VI</button><button id="musicBtn">♪</button></div>

<header id="hero">
  <div class="date reveal" id="dateTxt"></div>
  <div class="countdown reveal" id="countdown" aria-label="">
    <p class="countdown-title" data-i="countdownTitle"></p>
    <div class="countdown-units">
      <div class="countdown-unit"><span class="countdown-value" id="countDays">0</span><span class="countdown-label" data-i="days"></span></div>
      <div class="countdown-unit"><span class="countdown-value" id="countHours">00</span><span class="countdown-label" data-i="hours"></span></div>
      <div class="countdown-unit"><span class="countdown-value" id="countMinutes">00</span><span class="countdown-label" data-i="minutes"></span></div>
      <div class="countdown-unit"><span class="countdown-value" id="countSeconds">00</span><span class="countdown-label" data-i="seconds"></span></div>
    </div>
  </div>
  <h1 class="reveal"><span id="n1"></span> <span class="amp">&amp;</span> <span id="n2"></span></h1>
  <p class="reveal" data-i="tagline"></p>
  <div class="btns reveal"><a class="btn fill" href="#photos" data-i="seePhotos"></a><a class="btn" href="#venue" data-i="invite"></a></div>
</header>

<section id="story"><h2 class="reveal" data-i="storyTitle"></h2><div class="story" id="storyBox"></div></section>

<section id="photos"><h2 class="reveal" data-i="photosTitle"></h2><p class="sub" data-i="photosSub"></p><div class="gal" id="gal"></div></section>

<section id="venue"><h2 class="reveal" data-i="venueTitle"></h2><p class="sub" data-i="venueSub"></p>
  <div class="ev" id="events"></div>
  <div class="btns">
    <a class="btn fill" id="mapBtn" target="_blank" rel="noopener" data-i="map"></a>
    <button class="btn" id="calendarBtn" type="button" data-i="addToCalendar"></button>
  </div>
</section>

<footer><p data-i="thanks"></p><p data-i="promise"></p><img class="qrcode" src="photos/qrcode/qrcode.jpg?v=2" alt="Mã QR"></footer>
<a class="fab" href="#hero" aria-label="Back to top">↑</a>
<div id="lb" role="dialog" aria-modal="true" aria-label="Wedding photos">
  <button class="prev" type="button" aria-label="Ảnh trước">&#8249;</button>
  <img alt="">
  <button class="next" type="button" aria-label="Ảnh tiếp theo">&#8250;</button>
</div>

<script>
// ===== EDIT THIS BLOCK =====
const C={
  groom:"Lê Tuấn Anh", bride:"Nguyễn Hồng Thư",
  date:"2027-01-23",                       // Wedding date: YYYY-MM-DD
  ceremonyTime:"10:00",                   // Ceremony time: HH:MM (Vietnam time)
  music:"music/song.mp3",                                // e.g. "music/song.mp3"
  mapUrl:"https://maps.google.com/?q=Nhà+Hàng+MIKADO,+Sảnh+D,+Tầng+6,+487+Nguyễn+Tất+Thành,+Thanh+Khê,+Đà+Nẵng",
  // Story chapters: photos are file paths (leave [] for placeholders)
  story:[
    
    
    {vi:"Ngày mình gặp nhau",en:"The day we met",photos:["photos/story/met_1.jpg","photos/story/met_2.jpg","photos/story/met_3.jpg","photos/story/met_4.jpg"]},
    {vi:"Những khoảnh khắc đáng nhớ",en:"Memorable moments",tvi:"Chúng mình đồng ý làm người yêu từ đây",ten:"Where our story together began",photos:["photos/story/met_5.jpg","photos/story/met_6.jpg","photos/story/met_7.jpg","photos/story/met_8.jpg","photos/story/met_9.jpg","photos/story/met_10.jpg","photos/story/met_11.jpg","photos/story/met_12.jpg"]},
    {tvi:"Và rồi...",ten:"And...",photos:["photos/story/met_13.jpg","photos/story/met_14.jpg","photos/story/met_15.jpg","photos/story/met_16.jpg","photos/story/met_17.jpg","photos/story/met_18.jpg","photos/story/met_19.jpg","photos/story/met_20.jpg","photos/story/met_21.jpg","photos/story/met_22.jpg","photos/story/met_23.jpg","photos/story/met_24.jpg","photos/story/met_25.jpg","photos/story/met_26.jpg","photos/story/met_27.jpg","photos/story/met_28.jpg"]}
  ],
  gallery:Array.from({length:12},(_,i)=>`photos/wedding/${i+1}.jpg`),
  events:[
    {vi:"Lễ thành hôn",en:"Ceremony",placeVi:"Tư Gia Nam",placeEn:"Family Home",addrVi:"16 Phú Lộc 2, Thanh Khê, Đà Nẵng",addrEn:"16 Phu Loc 2, Thanh Khe, Da Nang"},
    {vi:"Tiệc cưới",en:"Reception",time:"11:00",placeVi:"Nhà Hàng MIKADO, Tầng 6, Sảnh D",placeEn:"MIKADO Restaurant, 6th Floor, Hall D",addrVi:"487 Nguyễn Tất Thành, Thanh Khê, Đà Nẵng",addrEn:"487 Nguyen Tat Thanh, Thanh Khe, Da Nang"}
  ]
};
const T={
 vi:{gate:"Chạm vào đây nhé",tagline:"Chúng mình sắp về chung một nhà!",countdownTitle:"Còn lại",days:"Ngày",hours:"Giờ",minutes:"Phút",seconds:"Giây",countdownDone:"Ngày vui của chúng mình đã đến!",seePhotos:"Xem ảnh cưới",invite:"Mời dự tiệc",storyTitle:"Chuyện của chúng mình",photosTitle:"Album cưới",photosSub:"Wedding Album",venueTitle:"Thư mời",venueSub:"Rất hân hạnh được đón tiếp bạn",map:"Xem bản đồ",addToCalendar:"Thêm vào Lịch",thanks:"Cảm ơn mọi người đã tới và chung vui cùng cô dâu chú rể",promise:"Chúng mình hứa sẽ sống thật hạnh phúc ♥"},
 en:{gate:"Touch here",tagline:"We're getting married!",countdownTitle:"Counting down",days:"Days",hours:"Hours",minutes:"Minutes",seconds:"Seconds",countdownDone:"Our special day is here!",seePhotos:"See photos",invite:"You're invited",storyTitle:"Our Story",photosTitle:"Wedding Album",photosSub:"Moments to remember",venueTitle:"Invitation",venueSub:"We'd be honored to have you with us",map:"Open map",addToCalendar:"Add to Calendar",thanks:"Thank you for celebrating with us",promise:"We promise to be happy together ♥"}
};
let lang="vi";const $=s=>document.querySelector(s);
const eventAddress=event=>event[`addr${lang==="vi"?"Vi":"En"}`]||event.addr||"";
const eventPlace=event=>event[`place${lang==="vi"?"Vi":"En"}`]||event.place||"";
const EXT=["jpg","jpeg","png","webp","JPG","JPEG","PNG"];
let lbIndex=0;
let lbGestureStart=null;
const lightboxImages=()=>[...document.querySelectorAll(".ph.loaded img")];
function handleLightboxSwipe(start,end){
  const deltaX=end.x-start.x;
  const deltaY=end.y-start.y;
  if(Math.abs(deltaX)<40||Math.abs(deltaX)<=Math.abs(deltaY))return;
  showLightboxImage(lbIndex+(deltaX<0?1:-1));
}
function showLightboxImage(index){
  const images=lightboxImages();
  if(!images.length)return;
  lbIndex=(index+images.length)%images.length;
  $("#lb img").src=images[lbIndex].src;
}
function openLightbox(image){
  const images=lightboxImages();
  lbIndex=images.indexOf(image);
  $("#lb").classList.add("open");
  document.querySelectorAll(".ph img").forEach(img=>img.loading="eager");
  showLightboxImage(lbIndex);
}
const ph=(src,label,hide)=>{const d=document.createElement("div");d.className="ph";d.innerHTML=`<span>${label||"Photo"}</span>`;if(src){const i=document.createElement("img");i.loading="lazy";i.decoding="async";i.alt="";const base=src.replace(/\.[^.\/]+$/,""),cands=[src,...EXT.map(e=>base+"."+e)];let k=0;i.onload=()=>{const sp=d.querySelector("span");if(sp)sp.remove();d.classList.add("loaded");d.style.aspectRatio="auto";d.style.minHeight="0"};i.onerror=()=>{if(++k<cands.length)i.src=cands[k];else if(hide)d.remove()};i.src=src;d.appendChild(i)}d.onclick=()=>{if(d.classList.contains("loaded"))openLightbox(d.querySelector("img"))};return d};
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[lang][e.dataset.i]);
  $("#n1").textContent=C.groom;$("#n2").textContent=C.bride;
  $("#dateTxt").textContent=new Date(C.date+"T00:00").toLocaleDateString(lang==="vi"?"vi-VN":"en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).replaceAll("/",". ");
  updateCountdown();
  $("#mapBtn").href=C.mapUrl;
  $("#events").innerHTML=C.events.map((e,i)=>`<div class="card"><h3>${e[lang]}</h3><p style="color:var(--accent);font-size:24px">${e.time||(!i?C.ceremonyTime:"")}</p><p>${eventPlace(e)}</p><p style="color:var(--muted)">${eventAddress(e)}</p></div>`).join("");
  $("#storyBox").innerHTML="";
  C.story.forEach(s=>{const c=document.createElement("div");c.className="chap reveal";c.innerHTML=(s[lang]||s.vi)?`<h3>${s[lang]||s.vi}</h3>`:"";const p=document.createElement("div");p.className="pair";(s.photos.length?s.photos:[null,null]).forEach(x=>p.appendChild(ph(x)));c.appendChild(p);c.insertAdjacentHTML("beforeend",`<p>${(lang==="vi"?s.tvi:s.ten)||s.tvi||""}</p>`);$("#storyBox").appendChild(c)});
  $("#gal").innerHTML="";C.gallery.forEach(x=>$("#gal").appendChild(ph(x,"",true)));
  observe();
}
function escapeIcsText(value){
  return String(value).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function foldIcsLine(line){
  const folded=[];
  let segment="",byteLength=0,limit=75;
  for(const character of line){
    const characterBytes=new TextEncoder().encode(character).length;
    if(byteLength+characterBytes>limit){
      folded.push(segment);
      segment=` ${character}`;
      byteLength=1+characterBytes;
      limit=75;
    }else{
      segment+=character;
      byteLength+=characterBytes;
    }
  }
  folded.push(segment);
  return folded.join("\r\n");
}
function addToCalendar(){
  const weddingDate=new Date(`${C.date}T00:00:00Z`);
  if(Number.isNaN(weddingDate.getTime()))throw new Error(`Invalid wedding date: ${C.date}`);
  const dateStamp=date=>date.toISOString().slice(0,10).replaceAll("-","");
  const endDate=new Date(weddingDate);
  endDate.setUTCDate(endDate.getUTCDate()+1);
  const agenda=C.events.map((event,index)=>{
    const time=event.time||(!index?C.ceremonyTime:"");
    return [event[lang],time,eventPlace(event),eventAddress(event)].filter(Boolean).join(" - ");
  }).join("\n");
  const locationEvent=C.events.find(event=>event.en==="Reception")||C.events[0];
  const location=locationEvent?[eventPlace(locationEvent),eventAddress(locationEvent)].filter(Boolean).join(", "):"";
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Anh&Thu Wedding//Wedding Invitation//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${dateStamp(weddingDate)}-${encodeURIComponent(C.groom)}-${encodeURIComponent(C.bride)}@our-wedding`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"")}`,
    `DTSTART;VALUE=DATE:${dateStamp(weddingDate)}`,
    `DTEND;VALUE=DATE:${dateStamp(endDate)}`,
    `SUMMARY:${escapeIcsText(`${C.groom} & ${C.bride} - ${lang==="vi"?"Ngày cưới":"Wedding day"}`)}`,
    `LOCATION:${escapeIcsText(location)}`,
    `DESCRIPTION:${escapeIcsText(agenda)}`,
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  const calendar=new Blob([lines.map(foldIcsLine).join("\r\n")+"\r\n"],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(calendar);
  const link=document.createElement("a");
  link.href=url;
  link.download="wedding.ics";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function updateCountdown(){
  const receptionTime=C.events.find(event=>event.en==="Reception")?.time||C.ceremonyTime;
  const target=Date.parse(`${C.date}T${receptionTime}:00+07:00`);
  const remaining=Math.max(0,target-Date.now());
  const totalSeconds=Math.floor(remaining/1000);
  const values={
    days:Math.floor(totalSeconds/86400),
    hours:Math.floor(totalSeconds%86400/3600),
    minutes:Math.floor(totalSeconds%3600/60),
    seconds:totalSeconds%60
  };
  $("#countDays").textContent=values.days;
  $("#countHours").textContent=String(values.hours).padStart(2,"0");
  $("#countMinutes").textContent=String(values.minutes).padStart(2,"0");
  $("#countSeconds").textContent=String(values.seconds).padStart(2,"0");
  const units=["days","hours","minutes","seconds"].map(key=>`${values[key]} ${T[lang][key]}`).join(", ");
  $("#countdown").setAttribute("aria-label",remaining===0?T[lang].countdownDone:`${T[lang].countdownTitle}: ${units}`);
  $("#countdown .countdown-title").textContent=remaining===0?T[lang].countdownDone:T[lang].countdownTitle;
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
function observe(){document.querySelectorAll(".reveal:not(.in)").forEach(e=>io.observe(e))}
$("#langBtn").onclick=e=>{lang=lang==="vi"?"en":"vi";e.target.textContent=lang.toUpperCase();render()};
$("#calendarBtn").onclick=addToCalendar;
let audio=null;
$("#musicBtn").onclick=e=>{if(!audio)return;audio.paused?audio.play():audio.pause();e.target.classList.toggle("on",!audio.paused)};
$("#gate").onclick=()=>{$("#gate").classList.add("hide");if(C.music){audio=new Audio(C.music);audio.loop=true;audio.play().then(()=>$("#musicBtn").classList.add("on")).catch(()=>{})}};
$("#lb .prev").onclick=e=>{e.stopPropagation();showLightboxImage(lbIndex-1)};
$("#lb .next").onclick=e=>{e.stopPropagation();showLightboxImage(lbIndex+1)};
$("#lb img").onclick=e=>e.stopPropagation();
$("#lb").onclick=e=>{if(e.target===$("#lb"))$("#lb").classList.remove("open")};
if("PointerEvent" in window){
  $("#lb").addEventListener("pointerdown",e=>{
    if(e.pointerType!=="touch")return;
    lbGestureStart={pointerId:e.pointerId,x:e.clientX,y:e.clientY};
    $("#lb").setPointerCapture(e.pointerId);
  });
  $("#lb").addEventListener("pointerup",e=>{
    if(!lbGestureStart||e.pointerId!==lbGestureStart.pointerId)return;
    handleLightboxSwipe(lbGestureStart,e);
    lbGestureStart=null;
  });
  $("#lb").addEventListener("pointercancel",()=>{lbGestureStart=null});
}else{
  $("#lb").addEventListener("touchstart",e=>{
    lbGestureStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null;
  },{passive:true});
  $("#lb").addEventListener("touchend",e=>{
    if(!lbGestureStart||e.changedTouches.length!==1){lbGestureStart=null;return}
    handleLightboxSwipe(lbGestureStart,{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY});
    lbGestureStart=null;
  },{passive:true});
  $("#lb").addEventListener("touchcancel",()=>{lbGestureStart=null},{passive:true});
}
document.addEventListener("keydown",e=>{
  if(!$("#lb").classList.contains("open"))return;
  if(e.key==="Escape")$("#lb").classList.remove("open");
  if(e.key==="ArrowLeft")showLightboxImage(lbIndex-1);
  if(e.key==="ArrowRight")showLightboxImage(lbIndex+1);
});
render();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
